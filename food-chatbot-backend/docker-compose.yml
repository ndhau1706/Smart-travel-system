# =============================================================================
# Food Chatbot Backend - Docker Compose Configuration
# =============================================================================
# Orchestrates the complete application stack including:
# - Backend API (FastAPI)
# - Redis (Caching)
# - Nginx (Reverse Proxy)
# - Prometheus (Monitoring - optional)
# - Grafana (Visualization - optional)
#
# Usage:
#   Development:   docker-compose up
#   Production:    docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   With monitoring: docker-compose --profile monitoring up
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Backend API Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: food-chatbot-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=${DEBUG:-false}
      - DATABASE_PATH=/app/database/chatbot.db
      - FAISS_INDEX_PATH=/app/data/faiss_index
      - BM25_INDEX_PATH=/app/data/bm25_index.pkl
      - RESTAURANTS_JSON_PATH=/app/data/hcm_restaurants_chatbot.json
      # Redis configuration
      - REDIS_URL=redis://redis:6379/0
      # Secrets (use docker secrets in production)
      - GROQ_API_KEYS=${GROQ_API_KEYS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    volumes:
      # Persistent data
      - backend-data:/app/data
      - backend-database:/app/database
      - backend-logs:/app/logs
      # Mount the restaurant data (read-only)
      - ./hcm_restaurants_chatbot.json:/app/data/hcm_restaurants_chatbot.json:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - chatbot-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ---------------------------------------------------------------------------
  # Redis - Caching Service
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: food-chatbot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - chatbot-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Nginx - Reverse Proxy & Load Balancer
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: food-chatbot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - chatbot-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ---------------------------------------------------------------------------
  # Prometheus - Metrics Collection (Optional - use profile)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: food-chatbot-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - chatbot-network

  # ---------------------------------------------------------------------------
  # Grafana - Visualization Dashboard (Optional - use profile)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: food-chatbot-grafana
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - chatbot-network

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  chatbot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  backend-data:
    driver: local
  backend-database:
    driver: local
  backend-logs:
    driver: local
  redis-data:
    driver: local
  nginx-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
